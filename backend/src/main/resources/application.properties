# ========================================================
# Connected Vehicle Telemetry System - Application Config
# ========================================================
server.port=${PORT:8082}
spring.application.name=connected-vehicle-telemetry

# ========================================================
# Security & JWT Token Config
# ========================================================
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-this-key-must-be-at-least-32-bytes-for-hs256}
jwt.expiry-hours=24
jwt.cookie-name=auth_token
jwt.cookie-secure=${COOKIE_SECURE:false}
jwt.cookie-samesite=${COOKIE_SAMESITE:Lax}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# ========================================================
# Default Database: Embedded H2 In-Memory Database
# (Provides Zero-Setup Instant Execution for Evaluation)
# ========================================================
spring.datasource.url=jdbc:h2:mem:telemetrydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ========================================================
# Telemetry Simulation Parameters
# ========================================================
telemetry.simulation.enabled=true
telemetry.simulation.interval-ms=4000
telemetry.threshold.overspeed-kmh=105.0
telemetry.threshold.high-temperature-c=95.0
telemetry.threshold.low-battery-percent=15.0

# Logging
logging.level.com.telemetry=INFO
logging.level.org.springframework.web=INFO
