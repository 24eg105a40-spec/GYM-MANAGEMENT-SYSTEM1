# ==========================================
# Server Configuration
# ==========================================
server.port=8080
spring.application.name=smart-gym-backend

# ==========================================
# Local Configuration
# ==========================================
spring.config.import=optional:file:./application-local.properties,optional:file:../application-local.properties

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_gym_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA and Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Security Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e71b5a6c4d8e2f1a3b5c7d9e0f2a4b6c8d1e3f5a7b9c1d3e5f7a9b1}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Initial Admin Configuration
# ==========================================
app.admin.email=${ADMIN_EMAIL:admin@gym.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:9876543210}

# ==========================================
# Logging
# ==========================================
logging.level.com.gymmanagement=INFO
logging.level.org.springframework.security=WARN
